# nontarget_cal default configuration. Override any subset with `--config my.yaml`.
# Strings starting with "@pkg/" resolve to the installed package directory.

paths:
  masks_dir: "@pkg/data/masks"                 # ego-body masks <camera>.png (255 = usable)
  rig_design: "@pkg/data/rig_design.yaml"      # design angles, seed lenses, reference rig (name identification)
  known_name_maps:                             # tried in order when --name-map is not given
    - "@pkg/data/name_maps/camera_name_map_20260924.yaml"
  serial_map: "@pkg/data/name_maps/camera_serial_map.yaml"
  ring_shift: "@pkg/data/ring_shift.npy"       # Ouster OS-2-128 per-ring destagger (sensor constant)
  layout_rules: "@pkg/config/layout_rules.yaml"

resources:
  # Worker processes. auto = logical CPUs / cpus_per_worker, capped by max_procs_cap and by RAM (the budget is
  # RAM - mem_headroom_gb; every task is also admitted only while the running tasks' memory estimates plus
  # its own fit the budget and the free RAM keeps the headroom). The environment variable
  # NONTARGET_MAX_PROCS overrides (the shared dev box: NONTARGET_MAX_PROCS=4). 20 logical CPUs, 32 GB -> 8.
  max_procs: auto
  max_procs_cap: 12
  cpus_per_worker: 2.5
  mem_headroom_gb: 6.0       # left to the OS, the GUI and the page cache
  cgroup_headroom_gb: 1.0    # instead, when the run is under a smaller cgroup memory limit (container, slice)
  # peak private memory per worker (GB), measured on the 25-window 2026-09-24 regression (RssAnon);
  # [a, b] = a + b x windows of the solve
  task_mem_gb: {default: 2.0, scan_bag: 1.0, extract_window: 1.0, extract_standstill: 1.0, lo_chain: 5.5,
                vehicle_axes: 1.5, rgb_tracks: 0.8, thermal_tracks: 1.2, thermal_edges: 1.0, thermal_links: 2.0,
                rgb_solve: [1.5, 0.3], thermal_solve: [1.5, 0.45], rgb_edges: 2.0, thermal_edge_eval: 7.0,
                images: 2.0, crosstime_links: 6.0}
  threads_per_proc: 3        # OMP/OPENBLAS/OpenCV threads per worker
  solver_threads: 4          # torch threads for the bundle adjustments
  kiss_threads: 3
  gpu: auto                  # auto | off   (only the optional parts use it; everything runs on CPU)
  ba_device: cpu             # cpu | auto | cuda: bundle adjustments on the GPU. Measured on the RTX 4060 Ti:
                             # no gain (float64 on consumer GPUs is 1/64 rate, the solves are latency-bound),
                             # results differ at 1e-11 mm. cpu = bit-identical to the validated scripts.
  lo_threads: 3              # threads inside one LiDAR-odometry refinement (deterministic for any value)
  tie_threads: 3             # windows associated in parallel with the LiDAR map (deterministic)
  track_threads: 2           # OpenCV threads of one RGB tracker (the LK is parallel over points; same tracks)
  tracks_nice: 5             # OS nice level of the RGB / thermal tracking workers: when the CPU is
                             # oversubscribed the LiDAR odometry (which gates both solve chains) gets it first
  track_cams_per_task: 2     # cameras of a window tracked in parallel threads of ONE worker (same tracks):
                             # more cores per worker slot when max_procs is the limit
  # Compiled (numba) kernels, same formulas as the validated numpy/torch code, sums in a different order
  # (results differ at the floating-point level: LO 4e-10 mm, BA < 1e-9 mm). torch / numpy = the
  # validated code bit for bit. Without numba installed the validated code runs.
  ba_kernel: numba           # numba | torch: RGB + thermal bundle adjustments (accumulate / cost: ~10-25x)
  lo_kernel: numba           # numba | numpy: LiDAR-odometry refinement pair terms (~2.5x per iteration)
  tie_cache_gb: 3            # per solve process: cached LiDAR-map candidates of the landmark ties between
                             # the solve rounds (identical ties, no map re-reads); 0 = off

viz:
  enabled: true             # observation-only, best-effort live stream; --no-viz disables it
  dir: null                 # default: <workdir>/viz; --viz-dir overrides it
  state_hz: 4.0
  map_hz: 1.0
  image_hz: 1.0
  max_points: 30000
  image_points: 5000
  image_width: 960
  retain_seconds: 120
  max_log_bytes: 16777216

topics:
  lidar_points: /ouster/points
  lidar_metadata: /ouster/metadata
  gps_fix: /gps/fix
  gps_vel: /gps/vel
  gps_odom: /gps/odom
  imu: /imu/data
  rgb_image: "/{name}/image_rgb/compressed"     # {name} = the topic namespace of one camera
  rgb_meta: "/{name}/image_raw/metadata"
  thermal_image: "/{name}/image_raw"
  thermal_meta: "/{name}/image_raw/metadata"

cameras:
  rgb: [camera_front1, camera_front2, camera_front3, camera_front4, camera_front5, camera_front6,
        camera_front7, camera_front8, camera_front9, camera_top, camera_side_left, camera_side_right,
        camera_rear_left, camera_rear_right]
  thermal: [thermal_left, thermal_right]
  reference: camera_front5                     # rig frame of rig YAMLs / thermal layout
  rgb_size: [1920, 1200]
  thermal_size: [640, 480]
  # canonical names also accepted as topic namespaces (bags recorded with the old names)
  aliases: {}

preflight:
  sample_period_s: 0.5         # one light range query every sample_period_s (no full-table scan)
  moving_speed_mps: 1.0
  turn_min_deg: 45.0           # a "turn" = a contiguous heading change of at least this much
  turn_rate_deg_s: 3.0
  rgb:
    recommend_moving_s: 180    # >= 3-5 min moving (lidar_odo README 6: 40 s -> +-3 cm axial, 200 s -> +-1-1.5 cm)
    recommend_rotation_deg: 1000   # handeye README 4: error ~ 1/sqrt(total rotation); 2165 deg -> 7 mm
    min_moving_s: 80           # hard minimum: two 40 s windows (half-vs-half needs >= 2 windows)
    min_rotation_deg: 250      # hard minimum: handeye front5 at 250 deg -> 21 mm (1 window-level accuracy)
  thermal:
    recommend_moving_s: 600    # thermal_lo: ~600 s of turning windows for +-15 mm along the axis
    recommend_turning_windows: 10
    min_turning_windows: 4     # hard minimum: 2 per half for the repeatability check
    near_structure_frac_min: 0.02   # share of LiDAR returns 2-10 m away (off the road) in a sampled sweep
  sync:
    max_camera_spread_ms: 2.0     # PTP-triggered Blackfly: simultaneous stamps agree to << 1 ms
    lidar_header_minus_receive_ms: [-500, 500]   # |header - bag time| beyond this: LiDAR not on the PTP clock
  exposure:
    min_us_night: 500          # 50 us at night = the camera is not exposing (black frames)
    max_us: 35000              # > frame period: motion blur, dropped frames
    night_mean_gray: 40        # a sampled image darker than this is "night"
  thermal_stream:
    min_fps: 25.0
    max_duplicate_frac: 0.05
  estimate:                    # per 40 s of moving data, measured on the 16-core dev box (lidar_odo/thermal_lo READMEs)
    rgb_disk_gb: 4.3
    thermal_disk_gb: 0.8
    fixed_disk_gb: 10.0
    rgb_cpu_min: 18.0          # extraction + KISS + refine + tracks (14 cams) + share of the BA, 4 procs
    thermal_cpu_min: 6.0
    fixed_min: 25.0
  disk_margin_frac: 0.30       # refuse unless free >= estimate * (1 + margin) + margin_gb
  disk_margin_gb: 20.0

windows:
  length_s: 40.0
  min_length_s: 15.0
  gap_s: 0.0
  moving_speed_mps: 1.0
  max_windows: 30              # per run, all bags together (the longest-rotation ones are kept)
  thermal_min_rotation_deg: 120.0   # thermal_lo: windows with >= 120 deg of total rotation
  structure_sample_every_s: 4.0
  standstill_min_s: 3.0        # a parked moment for the parked projection images
  margin_s: 0.3

extract:
  rgb_jpeg: raw                # the recorded JPEG bytes, unchanged
  # after a camera's KLT tracks of a window exist, keep only every N-th of its RGB frames (the LiDAR-edge
  # validation and the projection images read a few; nothing else reads images). ~40 GB less on a
  # 15-min drive. 0 = keep all. Ignored when rgb.crosstime is enabled (the links read the frames).
  keep_rgb_every: 10
  thermal_png_compression: 1
  thermal_lead_ms_name: 0      # thermal files are named by header.stamp (thermal_lo convention)

lo:
  # KISS-ICP only starts the continuous-time refinement. voxel 1.0 m (KISS-ICP's own default for 100 m
  # range) instead of lidar_odo's 0.5 m: KISS 2.1x faster; after the refinement the trajectory moves by
  # 0.9 mm median / 2.6 mm max (absolute) and 0.07 mm median / 0.56 mm p99 in the 1 s relative motion
  # (window S02 of the 2026-09-24 bag; the sweep-to-sweep consistency itself is ~15 mm). 0.5 = validated.
  kiss: {voxel: 1.0, rmin: 2.5, rmax: 100.0}
  refine: {iters: 5, src_voxel: 0.3, tgt_voxel: 0.1, scale: 0.03, cv_sigma: 0.05, max_src: 3000,
           offsets: [1, 2, 3, 5, 8, 13, 20]}
  map: {voxel: 0.05, rmin: 2.5, rmax: 80.0}
  check:
    gaps: [1, 10]
    n: 24
    max_gap10_mm: 35.0         # refined LO: 12-19 mm at 1 s (INS: 100-177 mm). Worse -> window dropped
    max_thickness_cm: 2.5      # refined: 1.3-1.8 cm (INS 2.9-3.9)
    min_path_m: 20.0           # a window that hardly moves carries no lever-arm information

rgb:
  # device: cpu = the validated OpenCV CPU Lucas-Kanade (tracks bit-identical); cuda = the same algorithm as
  # a Triton kernel on a CUDA GPU (rgb/cudalk.py: tracker CPU 48 -> 16 ms per 1920x1200 frame; float
  # interpolation: points differ by 0.0002 px median / 0.04 px p99, 0.003 % of the LK status flags);
  # opencl = OpenCV's OpenCL LK (on NVIDIA as much CPU as the CPU LK - the driver spins while waiting);
  # auto = cuda, else opencl, else cpu. (The anchored tracker below always runs its own CPU LK.)
  tracks:
    grid: [16, 9]
    per_cell: 8
    fb_max: 0.5
    min_len: 5
    device: auto
    # Template-anchored re-measurement of every track point (rgb/tracks_anchor.py). OFF: on the 2026-09-24 bag
    # (2 windows) its forward-backward closure was WORSE than the frame-to-frame LK (front 0.60 vs 0.25 px after
    # 1-2 s) and the BA residual fell only 0.795 -> 0.776 px, at ~3x the tracking wall time (README section 10).
    anchor: {enabled: false, max_age: 30, anchor_fb_max: 0.3, max_jump: 2.0}
  solve:
    free: [rot, pos, f, k, pp]
    ties: true
    tie_sigma: 0.03
    pos_prior: 10.0            # i.e. none (board-free)
    f_prior: 0.05
    pp_prior: 30.0
    k_prior: 0.05
    huber: 1.5
    iters: 25
    iters_first_pass: 40
    # also stop an LM once an accepted step moves every camera parameter by less than: rotation (rad),
    # position (m), log focal, principal point (px), distortion. The LM otherwise crawls on for up to
    # `iters` steps of < 0.0001 deg / 0.1 mm. On the 25-window regression: cameras move <= 0.14 mm,
    # <= 0.0005 deg, <= 0.007 px (1-2 % of the 1-sigma repeatability). null = the validated rule only.
    step_tol: {rot: 2.0e-6, pos: 1.0e-5, f: 1.0e-6, pp: 1.0e-3, k: 1.0e-6}
    min_len: 12
    min_parallax: 2.0
    max_dist: 60.0
    # data selection: small solves use 3000 tracks, every 3rd frame; big (> big_windows) 2000 / 4th
    max_tracks: 3000
    step: 3
    big_windows: 10
    max_tracks_big: 2000
    step_big: 4
    zeroshot_subset_windows: 5   # the 2-pass board-free start runs on this many windows (most rotation)
    # Speed option (off = the validated recipe). With <= zeroshot_subset_windows windows the final solve is
    # a third pass on the same data; reusing pass 2 saves one solve (~10 min for 4 windows) and moved the
    # cameras by 0.1-0.6 mm (front, top, side) and 3-6 mm (rear) on the 2026-09-24 bag (4 windows).
    reuse_pass2_as_final: false
    # Per-camera time offset dt (and optionally a rolling-shutter row readout time rs) in the rig BA
    # (rgb/rigba.py time model): capture time = header + exposure/2 + dt_c + rs_c (v/H - 1/2), the LO pose
    # re-evaluated at the new time between solves. Not in the first zero-shot pass. See README section 9.
    # 2026-09-24 bag (25 windows, tests/time_offset_eval_20260927.txt): common +0.5 ms, per camera +-0.3 ms, half-split
    # A-B 0.3 ms median; track residual, held-out, 1-sigma unchanged -> no timing error; off (cost ~+5 % per solve).
    time:
      enabled: false
      rolling_shutter: false     # Blackfly S (Sony Pregius) are global shutter
      dt_prior_ms: 50.0          # weak prior around the start value
      rs_prior_ms: 10.0
    # Track time span (README section 10, tests/resid_eval_20260927.txt): every KLT track used in the RGB BA
    # is cut into round(duration / seg_span_s) equal-time pieces, each its own landmark, so a landmark only has to
    # absorb the KLT drift of ~seg_span_s instead of carrying a whole track's drift into the extrinsics as a bias.
    # Not in the first zero-shot pass (design angles); the validation held-out uses whole tracks. null = the previous
    # recipe. 2026-09-24 bag, 25 windows, half-split 1-sigma, previous -> 2 s: front+top axis 7.6 -> 2.4 mm,
    # rear position 31.5 -> 6.3 mm, rear axis 15.6 -> 2.5 mm, rear rotation 0.25 -> 0.08 deg, side within noise;
    # track residual 0.843 -> 0.671 px, held-out unchanged, max shift vs the validated result 1.15 sigma.
    # 1 s: better front, worse side axis / rear (shorter baseline); 3 s: half the gain. Cost: +8 % BA time, +1 GB.
    seg_span_s: 2.0
    # Per-frame LiDAR-pose correction in the rig BA (rgb/framecorr.py): OFF. Track residual 0.843 -> 0.764 px
    # (with seg_span_s 2: 0.671 -> 0.592 px) but half-split 1-sigma, held-out and plane distance unchanged within the
    # one-split noise (the trajectory error averages out in the extrinsics). Re-test on another bag (side cameras).
    frame_corr: {enabled: false, rot: true, pos: true, sigma_rot_deg: 0.2, sigma_pos_m: 0.02, highpass_s: 1.0,
                 min_cams: 3, min_obs: 30}
    # Empirical observation weights by |t - track centre| (rgb/obsweight.py): OFF (1-sigma unchanged).
    obs_weight: {enabled: false, by: [age], nbins: 5, floor: 0.25}
  # Cross-camera / cross-TIME landmark links (rgb/crosstime.py) added to the final solve. OFF by default:
  # on the 2026-09-24 bag (25 windows) they tightened the front cluster (rotation 1-sigma 0.035 -> 0.015 deg,
  # along-axis 7.6 -> 2.9 mm) but did not help side/rear consistently (rear_right links: ~300) and raised the
  # track residual 0.84 -> 1.07 px; with strict links (merged point within 1/2 px) the residual stays 0.86 px
  # but the gain shrinks (front along-axis 7.6 -> 5.8 mm, side/rear no gain). Held-out unchanged in all cases.
  # Cost: ~0.5-3 h linking + ~15 % BA. See README section 8 and tests/crosstime_eval_20260926.txt.
  crosstime:
    enabled: false
    gate_a_m: 0.03
    gate_b: 0.004
    max_px_med: 2.0
    max_px_p90: 4.0
    # appearance check of a link: sift (descriptor distance, the 2026-09-26 evaluation) or rectified crop pairs
    # (rgb/lmatch.py: virtual pinhole views at a common metric scale, a learned matcher as a gross centre-transfer
    # check, then sub-pixel NCC of the centre): xfeat_lighterglue (evaluated, Apache-2.0) | aliked_lightglue |
    # disk_lightglue | xfeat_mnn | superpoint_lightglue (weights non-commercial) | ncc (no learned model; equal
    # to the learned ones in the bake-off, not run through the full evaluation). Learned models need the
    # optional `lightglue` package (github.com/cvg/LightGlue) / XFeat (NONTARGET_XFEAT_DIR); GPU when
    # available, CPU fallback. 2026-09-24 bag with xfeat_lighterglue (tests/crosstime_eval_learned_20260926.txt):
    # front rotation 1-sigma 0.035 -> 0.017 deg, along-axis 7.6 -> 4.6 mm, rear position 31.5 -> 16.2 mm, track
    # residual 0.84 -> 0.90 px (SIFT: 1.07), side not improved, rear links still few -> stays off by default.
    matcher: sift
    learned:                     # candidate gates: the ones above (gate_a_m ... max_px_p90)
      crop_px: 160               # rectified crop size, metric width >= crop_m (never finer than native)
      crop_m: 1.5
      max_kpts: 256
      min_local: 6               # matches supporting the centre transfer
      gross_px: 3.0              # learned centre transfer vs the other track's point (native px)
      ncc_min: 0.8               # NCC of the centre template on the rectified crops
      tol_px: 1.0                # accepted centre offset (native px)
      device: null               # null: cuda if available
  perbag:
    sigma_axis_mm_40s: 25.0      # empirical 1-window scatter along the axis (lidar_odo 3.3: 17-33 mm)
    sigma_rot_deg_40s: 0.15      # 0.06-0.18 deg per window
    floor_axis_mm: 10.0
    floor_rot_deg: 0.06
    k_sigma: 3.0
    max_cams_out: 2              # more cameras than this beyond k sigma -> the bag disagrees

thermal:
  tracks: {prep: lcn, grid: [12, 9], per_cell: 10, fb_max: 0.4, min_len: 5, device: auto}   # device: as rgb.tracks (CUDA LK: tracking 25 -> 3 ms CPU per frame)
  time_model: smooth
  lens: {min_dist: 25.0, free: [rot, f, pp, k, rs, dt], rounds: 2}
  pos: {free: [rot, pos, dt], ties: true}
  final: {free: [rot, pos, f, aspect, dt], ties: true, edges: true, stereo: true}
  solve_defaults: {tie_sigma: 0.03, min_len: 12, step: 3, max_tracks: 4000, max_obs: 40, min_parallax: 1.5,
                   max_dist: 150.0, huber: 1.0, iters: 25, rounds: 3, pos_prior: 1.0, f_prior: 0.05,
                   pp_prior: 20.0, k_prior: 0.1, edge_weight: 1.0, edge_sigma: 1.0, edge_maxdepth: 40.0,
                   edge_mindepth: 1.5,
                   # as rgb.solve.step_tol, plus time offsets / row readout (s); null = validated rule only
                   step_tol: {rot: 2.0e-6, pos: 1.0e-5, f: 1.0e-6, pp: 1.0e-3, k: 1.0e-6, dt: 1.0e-6}}
  edges: {every: 6, hist_s: 1.6, maxp: 1500}
  stereo: {every: 6, gate: 6.0}

validation:
  halves: true
  # start of the two RGB half solves: "start" = the final solve's own start (zero-shot pass 2 / --init),
  # run next to the final (~8 min less on 25 windows); "final" = from the final result, after it
  # (validated order). Only the repeatability numbers of the validation depend on it.
  rgb_halves_start: start
  heldout: true
  edge_frames: 12               # frames per camera and window for the LiDAR-edge metric
  vote: true
  # repeatability: two disjoint halves; sigma(full data) = |A - B| / 2 (each half has half the data,
  # sigma_half = |A-B|/sqrt(2), and the full solve is sqrt(2) better)
  sigma_from_halves: half_difference
  gate:
    rgb_rot_deg: 0.5
    rgb_axis_mm: 60.0
    thermal_axis_mm: 60.0
    # voting gate on the LO-accumulated thermal edges (validate/edges_eval.py OrientedVote). Calibrated on the
    # 2026-09-24 bag: the validated thermal_lo result and this tool both give peaks within 0.6 px, contrast
    # 1.64-1.71 (du) / 2.06-2.12 (dv), 17-18 of 18 cells at the origin; a 0.25 deg yaw error moves the du
    # peak to -3.9 px and leaves only 7-8 of 18 cells at the origin. (thermal_online's 1.8 applies to its
    # single-sweep edges, whose profiles are sharper.)
    vote_max_offset_px: 1.0
    vote_min_contrast: 1.4
    vote_min_cell_frac: 0.67

outputs:
  zip_name: nontarget_cal.zip
  camera_info: true
  images: {parked: true, driving: true, max_range_m: 40.0}
