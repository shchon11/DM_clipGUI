# sensors.yaml — 센서군 레지스트리.
#
# GUI의 "센서 기동" 탭이 읽는 유일한 소스. 센서를 추가/교체하면 코드가 아니라 이 파일을 고친다.
#
# 각 센서군(group)은 세 가지를 선언한다:
#   discovery : 그 센서를 네트워크에서 어떻게 찾는가
#   launch    : 어떤 워크스페이스를 소싱해 어떤 런치를 띄우는가
#   fields    : 설정 탭 맨 위 '주요 설정' 에 한국어 이름으로 올릴 키 (원본 params YAML의 키 또는 런치 인자)
#
# 설정 탭의 '전체 설정' 은 여기 적지 않아도 원본 params YAML 의 모든 키(주석 처리된 키 포함)와
# 런치 파일의 모든 인자를 파일에서 직접 읽어 보여준다 (scripts/param_doc.py). 그래서 fields 에는
# "자주 바꾸고, 잘못 바꾸면 위험해서 설명이 필요한 것" 만 올린다.
#   managed_params / managed_launch_args : 런치나 GUI 가 따로 정해서 '전체 설정' 에서 바꿔 봐야
#     소용없는 키 — 읽기 전용으로 보여주고 이유를 단다. "network.force_ip.*" 처럼 * 를 쓸 수 있다.
#   panel   : 기능군 상자 (그룹의 panels: 에 제목 · 설명) — 카메라 제어 / ISP / PC 처리 · 출력.
#   section : 상자 안의 소제목
#   조건 두 가지 — {키: 값, …} 는 AND, 값이 목록이면 그중 하나, [{…}, {…}] 처럼 목록으로 주면 OR:
#     enabled_when  : 안 맞으면 칸 전체가 회색이 되고 생성 파일에서도 빠진다. 카메라가 거부해 노드가 죽거나
#                     (노출 auto 인데 노출 시간) 짝 설정 없이 쓰면 결과가 불확실한 칸에만 쓴다.
#     relevant_when : 안 맞으면 이름만 흐려진다. 편집할 수 있고 값은 그대로 파일에 실린다 — 지금 설정에서는
#                     효과가 없을 뿐 해는 없는 칸 (JPEG 을 안 낼 때의 JPEG 품질).
#   writes   : 노드 파라미터(camera.* 가 아닌 키)가 노드 로직으로 쓰는 GenICam 노드 — 줄의 '노드→GenICam' 태그.
#              노드는 camera.* 를 적용한 뒤에 이걸 쓰므로, 같은 노드의 camera.* 키는 managed_params 로 잠근다.
#   alias_of : camera.* 키가 공개 노드가 아니라 그 레지스터 별칭일 때 원래 노드 이름 (Gamma_FloatVal → Gamma).
#   live_alias : ISP 튜닝에서 실행 중에 넣을 때 이 키가 등록돼 있지 않으면 대신 쓸 별칭 (ExposureTime → ExposureTime_FloatVal).
#   scale / file_type : 파일 값 = 폼 값 × scale. file_type: int 면 정수로 반올림 (정수 레지스터 별칭).
#   placeholder : 문자열 칸이 비었을 때 흐리게 보일 글 — 비우면 어떻게 되는지 (예: '자동').
# subset 의 genicam: {xml, categories} — '전체 설정' 에 카메라 GenICam XML 의 노드를 카테고리별로 올린다.
# subset 의 checks: {sensor, uplink_MBps} — 엮인 설정끼리의 문제를 기동 전에 찾는다 (sensor_config.check_settings).
#
# 원본 params YAML은 절대 수정하지 않는다. 폼에서 바꾼 키만 덮어쓴 사본을
# ~/.config/dm_clip_gui/sensors/<group>.yaml 로 생성해 런치에 넘긴다.
#
# 경로의 ~ 는 확장된다. 존재하지 않는 워크스페이스/파일은 GUI가 그 센서군을 "설정 없음"으로
# 표시하고 기동 버튼을 잠근다 (죽지 않는다).

groups:

  # ---------------------------------------------------------------------------
  # FLIR 카메라 — 가시광 Blackfly + 열화상 A70. 프로세스는 하나다.
  #
  # UI에는 두 줄로 보이지만 multicam.launch.py 한 번으로 둘 다 띄운다. 따로 띄우면
  #   1) 양쪽이 ptp4l을 각각 띄워 같은 NIC에서 충돌하고
  #   2) ForceIP 시퀀스가 동시에 돌아 서로의 IP를 덮어쓴다
  # 2번은 실제로 A70 두 대가 같은 192.168.1.12에 앉아 스트림이 죽은 적이 있다.
  # ---------------------------------------------------------------------------
  - key: flir_cameras
    label: "FLIR 카메라"
    workspaces:
      - "~/FLIR_control/scripts/setup_flir_env.bash"
      - "~/FLIR_control/install/setup.bash"
    launch_package: flir_spinnaker_camera
    launch_file: multicam.launch.py
    # 카메라 노드의 camera_info.yaml_path / extrinsics_yaml_path 는 리포 루트 기준
    # 상대 경로라 CWD가 리포 루트여야 한다. 아니면 "Failed to open camera_info YAML file".
    workdir: "~/FLIR_control"
    # topic_regex: 기동 완료 판정용. 보이는 대수만큼 네임스페이스(/thermal0/, /thermal1/ …)가
    # 떠야 그 subset 이 올라온 것으로 본다.
    #
    # inventory / inventory_arg: 기동할 때마다 "지금 보이는 카메라만" 담은 인벤토리 사본을 만들어
    # 이 런치 인자로 넘긴다. 저장된 인벤토리를 그대로 쓰면 꺼져 있는 카메라까지 노드가 떠서 죽고,
    # 안 보이는 카메라가 PTP sender 면 받는 쪽 카메라가 트리거를 영원히 기다려 프레임이 0장이 된다.
    # 리포의 인벤토리는 읽기만 한다 (런치의 auto_update 도 사본에 쓴다).
    # name_prefix: 인벤토리에 없는 카메라 이름 = <prefix>_<serial> (꽂힌 조합과 무관하게 고정).
    # sync_roles: PTP/GPIO 동기 역할이 있는 카메라군 — 보내는 쪽이 없으면 기동 때 바로잡는다.
    # external_trigger: GPIO 트리거 발생원이 카메라가 아니라 외부(GNSS PPS 등)다. master 카메라 없이 slave 만
    #   있어도 정상이라 기동 때 slave 를 풀지 않고, 새 카메라의 기본 동기 방식도 'HW 트리거' 가 된다.
    #   카메라에는 PTP 를 주지 않는다 — 노출은 트리거가 맞추고, 카메라 시계는 카메라마다 따로 도는 카운터다.
    #   (docs/gnss_pps_sync_gui.md §3)
    # 사본을 넘길 때 런치의 인벤토리 자동 갱신은 끈다. 감지·IP 맞춤·이름·PTP sender 는 GUI 가 하고,
    # 켜 두면 런치가 GUI 가 일부러 뺀 카메라(예: 업데이터 모드)를 다시 넣어 노드가 죽는다.
    inventory_launch_args:
      auto_update_cameras_file: false
      auto_update_thermal_cameras_file: false
    # 카메라 노드가 영상 수신을 시작하면 찍는 로그. 노드는 뜨자마자(카메라를 열기 전에) 발행자를 만들어서
    # 토픽만으로는 영상이 나오는지 모른다 — 이 줄이 찍혀야 그 카메라가 '실행 중'이다 (카드 · 표의 점).
    ready_log: "Camera acquisition started"
    # 떴지만 문제가 있는 장비를 알리는 노드 로그 — 그 장비 행이 주황 점이 된다. 설정 일부 미적용:
    # 노드는 기동 때 쓸 수 있는 GenICam 노드만 파라미터로 받아서, 카메라에 남은 상태(전원을 끄기 전까지 유지)에
    # 따라 AcquisitionFrameRate · ExposureTime · Gamma 같은 값이 어떤 카메라에서만 조용히 버려졌다 — 2026-09-21
    # 14대 중 1대가 30 fps 제한 없이 ~51 fps 로 링크를 다 썼다. 노드가 이제 풀린 노드를 다시 등록해 적용하고,
    # 그래도 남은 것은 이 줄로 알린다 (FLIR_control RegisterControlParametersUnlockedByOverrides).
    issue_logs:
      - match: "startup camera override(s) NOT applied"
        text: "설정 일부가 카메라에 안 들어감"
      # 노드가 기동 설정을 다 마친 뒤 설정 파일의 camera.* 값을 카메라에서 다시 읽어 비교한다. 다르면 한 번 다시
      # 쓰고(WARN 'Re-applied …'), 그래도 다르면 이 줄을 ERROR 로 찍는다 — 짝 레지스터가 서로 덮어쓰거나(GevSCPD ↔
      # 링크 대역폭 제한, 2026-09-22) 카메라가 거부한 값. 자세한 키와 값은 런치 로그에.
      - match: "not in effect after startup"
        text: "설정 일부가 카메라에 안 남음 — 다른 설정이 덮어썼거나 카메라가 거부 (런치 로그)"
      # 카메라 연결이 끊겨(케이블 · PoE · 카메라 재부팅) 스트림이 중단되면 노드는 영상 받기를 멈추고 살아만 있다 —
      # 그 뒤로는 타임아웃 경고도 안 찍혀 행이 초록으로 남았다 (2026-09-22 06:34 camera_front2: 레지스터 쓰기 -1010 →
      # 'Stream has been aborted' → 이후 9분 동안 0장). 재기동 전까지 풀리지 않는다 (recurring 아님).
      - match: "Stopping acquisition after fatal Spinnaker stream error"
        text: "카메라 연결 끊김 — 영상 받기를 멈춤 (케이블 · PoE 확인 후 재기동)"
      # 노드가 프레임을 acquisition_timeout_ms(3초) 기다려도 안 오면 찍는다. HW 트리거 카메라가 펄스를 못 받으면
      # 'Camera acquisition started' 는 찍혀서 실행 중(초록)으로 보이는데 프레임은 0장이다 (2026-09-22: HW 트리거로
      # 바꾼 뒤 가시광 전부 0 Hz, 열화상만 30 Hz). 이 줄이 10초 넘게 멈추면 풀린 것으로 본다.
      - match: "NEW_BUFFER_DATA"
        text: "프레임이 안 옴 — HW 트리거면 트리거 펄스가 안 들어오는 것 (배선 · 발생기 · 입력 라인 · 엣지)"
        recurring: true
    # 전체 설정에서 읽기 전용으로 보일 것 (params 쪽은 두 subset 공통)
    managed_params:
      camera_serial: "런치가 인벤토리의 serial 로 카메라마다 덮어씁니다"
      camera_index: "camera_serial 이 있으면 쓰이지 않습니다 (런치가 serial 을 줍니다)"
      frame_id: "런치가 카메라마다 <이름>_optical_frame 으로 덮어씁니다"
      camera_info.yaml_path: "런치 인자 camera_info_yaml_path 가 덮어씁니다"
      hardware_trigger.role: "카메라별 역할 — '감지된 장비' 표의 동기 방식 칸에서 정합니다"
      ptp_action.role: "카메라별 역할 — '감지된 장비' 표의 동기 방식 칸에서 정합니다"
      "network.force_ip.*": "IP 는 GUI 가 기동 전에 맞춥니다 ([IP 할당] / IP 자동 맞춤)"
    managed_launch_args:
      "auto_update_*": "GUI 가 감지 결과로 인벤토리 사본을 만들어 넘기므로 쓰지 않습니다"
      thermal_model_patterns: "가시광/열화상 구분은 sensors.yaml 의 model_patterns 로 합니다"
      thermal_force_ip_base: "새 카메라 IP 는 [IP 할당] 이 sensors.yaml 의 force_ip_base 부터 줍니다"
      "auto_*force_ip*": "IP 는 GUI 가 기동 전에 한 대씩 맞춥니다 ([IP 할당] / IP 자동 맞춤)"
      force_ip_in_camera_nodes: "IP 는 GUI 가 기동 전에 한 대씩 맞춥니다 — 노드들이 동시에 ForceIP 하면 서로 덮어씁니다"
    subsets:
      - key: visible
        label: "가시광 Blackfly"
        short_label: "BFS"          # 좁은 칸(녹화 탭 네트워크 표)에 쓰는 이름
        model_patterns: ["Blackfly"]
        enable_arg: enable_visible_cameras
        inventory: "~/FLIR_control/src/flir_spinnaker_camera/config/multicam_cameras.yaml"
        inventory_arg: cameras_file
        name_prefix: camera
        force_ip_base: "192.168.1.1"     # [IP 할당] 이 새 카메라에 줄 첫 주소
        sync_roles: true
        external_trigger: true
        params: "~/FLIR_control/src/flir_spinnaker_camera/config/flir_camera.yaml"
        params_arg: params_file
        # camera_center / camera0 / camera_25415251 모두 (auto_update 가 붙이는 cameraN 포함)
        topic_regex: "^/camera[a-z0-9_]*/"
        # 카메라 GenICam XML — '전체 설정' 에 이 카테고리들의 노드를 전부 'GenICam · …' 상자로 올린다
        # (scripts/genicam_doc.py). params YAML 에 없는 ISP 노드(채도 · 샤프닝 · 색변환 · LUT · 자동 노출 튜닝)도
        # 여기서 빠짐없이 나온다. Spinnaker 가 카메라에 처음 붙을 때 받아 캐시한 파일이라 카메라가 꺼져 있어도
        # 읽힌다. 리그의 BFS 는 전부 BFS-PGE-23S3C. 다른 모델을 섞으면 그 모델의 zip 도 여기 생긴다.
        # 기동 전 설정 점검 (sensor_config.check_settings) — 링크 대역폭 · 스위치 업링크 · 노출 대 프레임 주기 ·
        # auto 한계 순서 · 비닝 뒤 해상도 · 캘리브레이션 해상도 · 노출 auto 의 카메라별 편차. 카드 머리와 런치
        # 로그에 뜬다. RGB8Packed 에 30 fps 를 지정했더니 카메라가 14.4 fps 초과를 거부해 14대가 전부 죽었다 (2026-09-21).
        checks:
          sensor: [1920, 1200]     # 비닝 · 데시메이션 전 최대 해상도 (BFS-PGE-23S3C, IMX392)
          uplink_MBps: 1150        # 카메라 스위치 → PC 10 GbE 실효 (DeviceLinkThroughputLimit 설명과 같은 값)
        # [ISP 튜닝] 탭 — 카메라 한 대만 띄워 놓고 이 칸들을 바꾸면 재기동 없이 바로 카메라에 들어간다 (카메라 노드가
        # 실행 중 camera.* 파라미터를 받는 즉시 카메라에 쓴다). 설정 탭과 따로 놀고, [전역 설정에 반영] 으로 덮어쓴다.
        # 올리는 칸 = 주요 설정 중 camera.* 인 것 가운데 이 panel · section 에 속한 것.
        tuning:
          panels: [isp]
          sections: ["노출 · 게인", "자동 노출 · 게인 한계"]
        genicam:
          xml: "~/.config/spinnaker/xml/BFS-PGE-23S3C_*_GENICAM.zip"
          categories: [AnalogControl, ColorTransformationControl, LUTControl, AutoAlgorithmControl,
                       DefectivePixelCorrection]
          # 값 조건까지 확실한 종속 (GenICam 칸의 enabled_when / relevant_when). 어느 노드가 잠김에 관여하는지는
          # XML 에서 자동으로 뽑아 툴팁에 보이지만(genicam_doc.dependencies), 켜야 풀리는지 꺼야 풀리는지는 XML 에
          # 없어서 여기 적는다. 근거는 XML ToolTip, 그리고 2026-09-21 공장값 상태로 떠 있던 노드에 그 파라미터가
          # 등록됐는지(= 그 상태에서 쓸 수 있었는지). 조건 값의 null 은 '지정 안 함'(카메라에 남은 값)도 허용한다는
          # 뜻 — 공장값이 조건을 만족할 때만 넣는다. 2026-09-21 GUI 가 만든 파일에 조명 모드 AutoDetect 와 측광
          # 모드 Average 가 같이 들어 있었다 — 측광 모드는 Normal 에서만 쓸 수 있다.
          rules:
            AutoExposureMeteringMode:
              enabled_when: {"camera.AutoExposureLightingMode": ["Normal", null]}
              why: "측광 모드는 조명 모드가 Normal 일 때만 쓸 수 있습니다 (ToolTip) — 다른 조명 모드에서 쓰면 카메라가 거부합니다."
            AutoExposureTargetGreyValue:
              enabled_when: {"camera.AutoExposureTargetGreyValueAuto": "Off"}
              why: "목표 밝기를 직접 줄 때만 씁니다 — 목표 밝기 auto 가 Continuous(공장값)면 잠겨 있습니다."
            AutoExposureLightingMode:
              enabled_when: {"camera.AutoExposureTargetGreyValueAuto": ["Continuous", null]}
              why: "목표 밝기 auto 가 Continuous(공장값)일 때 쓸 수 있었습니다 (2026-09-21 확인)."
            AutoExposureEVCompensation:
              enabled_when: {"camera.AutoExposureTargetGreyValueAuto": ["Continuous", null]}
              why: "목표 밝기 auto 가 Continuous(공장값)일 때 쓸 수 있었습니다 (2026-09-21 확인). 목표 밝기를 직접 주면 그 값이 대신합니다."
            AutoExposureControlPriority:
              enabled_when: {"camera.ExposureAuto": "Continuous", "camera.GainAuto": "Continuous"}
              why: "노출과 게인이 둘 다 auto 일 때만 의미가 있습니다 (무엇부터 올릴지). 노출 auto Once · 게인 Off 이던 리그에서는 잠겨 있었습니다."
            BalanceWhiteAutoDamping:
              enabled_when: {"camera.BalanceWhiteAuto": ["Once", "Continuous", null]}
              why: "WB auto 가 꺼져 있으면 잠깁니다 (XML: BalanceWhiteAuto 에 따라 잠김)."
            BalanceWhiteAutoLowerLimit:
              relevant_when: {"camera.BalanceWhiteAuto": ["Once", "Continuous", null]}
            BalanceWhiteAutoUpperLimit:
              relevant_when: {"camera.BalanceWhiteAuto": ["Once", "Continuous", null]}
            SharpeningThreshold:
              enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"], "camera.SharpeningEnable": true, "camera.SharpeningAuto": false}
              why: "샤프닝을 켜고 auto 를 끈 RGB 출력에서만 씁니다."
            AasRoiOffsetX:
              relevant_when: {"camera.AasRoiEnable": true}
            AasRoiOffsetY:
              relevant_when: {"camera.AasRoiEnable": true}
            AasRoiWidth:
              relevant_when: {"camera.AasRoiEnable": true}
            AasRoiHeight:
              relevant_when: {"camera.AasRoiEnable": true}
        managed_params:
          # 주요 설정 ISP 가 같은 레지스터를 별칭 키로 쓴다 — 두 칸에서 따로 쓰면 이름순으로 나중 것이 이긴다.
          camera.Gamma: "주요 설정 ISP 의 '감마 값'(camera.Gamma_FloatVal)과 같은 레지스터입니다 — 거기서 정합니다"
          camera.Saturation: "주요 설정 ISP 의 '채도'(camera.Saturation_FloatVal)와 같은 레지스터입니다 — 거기서 정합니다"
          camera.Sharpening: "주요 설정 ISP 의 '샤프닝 양'(camera.SharpMult_FloatVal)과 같은 레지스터입니다 — 거기서 정합니다"
          camera.Gain: "주요 설정의 '게인'(camera.GainDB_Val)과 같은 레지스터입니다 — 거기서 정합니다 (게인 auto 검사도 거기서)"
          camera.BlackLevelRaw: "주요 설정 ISP 의 '블랙 레벨'(%)과 같은 값의 다른 단위입니다 — 거기서 정합니다"
          # 패킷 간 지연과 링크 대역폭 제한은 같은 것을 두 방식으로 적는 짝이다 — 카메라는 하나를 쓰면 다른 하나를
          # 다시 계산한다. 원본 YAML 의 GevSCPD: 0 이 75 MB/s 제한 뒤에 들어가 14대 중 13대가 125 MB/s 로 되돌아갔고,
          # 동시 트리거에서 스위치가 패킷을 버려 센서가 들어왔다 말았다 했다 (2026-09-22). 생성 파일에서도 뺀다.
          camera.GevSCPD: "패킷 간 지연은 '카메라당 링크 대역폭'(DeviceLinkThroughputLimit)이 정합니다 — 둘은 카메라 안에서 같은 값의 짝이라, 따로 쓰면 대역폭 제한이 풀립니다"
          # 패턴(*)을 쓰지 않는다 — camera.BalanceRatio* 는 주요 설정의 BalanceRatioRed_Val 까지 잠가 파일에서 뺀다.
          camera.BalanceRatio: "WB 비율은 주요 설정 ISP 에서 R · B 따로 정합니다 — 이 노드는 선택자로 고른 한 채널뿐입니다"
          camera.BalanceRatio_FloatVal: "WB 비율은 주요 설정 ISP 에서 R · B 따로 정합니다 — 이 노드는 선택자로 고른 한 채널뿐입니다"
          camera.BalanceRatioSelector: "WB 비율은 주요 설정 ISP 에서 R · B 따로 정해서 선택자가 필요 없습니다"
          camera.LUTIndex: "LUT 는 인덱스로 고르는 표라 파라미터 파일로는 한 칸밖에 못 씁니다 — 표 편집은 SpinView 로"
          camera.LUTValue: "LUT 는 인덱스로 고르는 표라 파라미터 파일로는 한 칸밖에 못 씁니다 — 표 편집은 SpinView 로"
          "camera.DefectTable*": "결함 화소 표는 인덱스로 고르는 표라 파라미터 파일로는 못 씁니다 — SpinView 로"
          camera.ColorTransformationSelector: "CCM 은 RGBtoRGB 기준으로 ISP 의 '색 보정 행렬' 칸에서 정합니다"
          camera.ColorTransformationValueSelector: "행렬 칸은 선택자로 하나씩 고르는 구조라 파라미터 파일로 못 씁니다 — ISP 의 CCM 광원 프리셋으로"
          camera.ColorTransformationValue: "행렬 칸은 선택자로 하나씩 고르는 구조라 파라미터 파일로 못 씁니다 — ISP 의 CCM 광원 프리셋으로"
          # 노드가 자기 로직으로 쓰는 GenICam 노드. 노드는 camera.* 를 먼저 적용하고 그 뒤에 동기 설정을 쓰므로
          # (ApplyPtp → ApplyHardwareTrigger → ApplyPtpAction) 여기서 바꿔 봐야 덮어써진다. 원본 YAML 에 적힌
          # 값(camera.TriggerMode: "Off")은 그대로 실린다 — 동기 역할이 없는 카메라는 그 값으로 자유 실행한다.
          "camera.Trigger*": "트리거는 카메라별 동기 방식('감지된 장비' 표)과 카메라 제어의 트리거 칸이 정합니다 — 노드가 camera.* 뒤에 다시 씁니다"
          "camera.Line*": "GPIO 라인은 노드의 hardware_trigger.* 가 정합니다 — LineSelector 로 고르는 구조라 여기서 쓰면 어느 라인에 걸릴지도 모릅니다"
          camera.V3_3Enable: "노드의 hardware_trigger.master.* (3.3 V 출력)가 정합니다"
          "camera.UserOutput*": "노드의 hardware_trigger.* 가 정합니다"
          "camera.GevIEEE1588*": "PTP 는 카메라 제어의 'PTP 시각 동기'(ptp.enable)와 동기 방식이 정합니다"
          "camera.Ptp*": "PTP 는 카메라 제어의 'PTP 시각 동기'(ptp.enable)와 동기 방식이 정합니다"
          "camera.Action*": "PTP 액션 트리거는 노드의 ptp_action.* 가 정합니다"
      - key: thermal
        label: "열화상 A70"
        short_label: "A70"
        model_patterns: ["FLIR A70", "FLIR A50"]
        enable_arg: enable_thermal_cameras
        inventory: "~/FLIR_control/src/flir_spinnaker_camera/config/multicam_thermal_cameras.yaml"
        inventory_arg: thermal_cameras_file
        name_prefix: thermal
        force_ip_base: "192.168.1.101"   # 가시광(.1~) 과 겹치지 않게 (2026-09-28, A70 두 대 .101 · .102)
        # [IP 할당] 뒤 새 주소로 다시 대답하기까지 기다리는 최대 시간. A70 은 네트워크를 다시 올리는 데 오래 걸려
        # 기본 6초로는 '실패' 로 끝나고 감지에서 빠졌다 (2026-09-22). 대답하는 즉시 끝난다.
        force_ip_settle_s: 60
        params: "~/FLIR_control/src/flir_spinnaker_camera/config/thermal_camera.yaml"
        params_arg: thermal_params_file
        topic_regex: "^/thermal[a-z0-9_]*/"
    discovery:
      kind: gvcp
      nics: []          # 비우면 UP 상태인 모든 물리 NIC을 훑는다

    # [동기 검증] (가시광 카드의 '동기 검증' 탭) — FLIR 리포의 스크립트를 이 센서군의 워크스페이스를
    # 소싱해 돌리고 결과를 표로 보여준다. 카메라 PTP 없이 GPIO 트리거만 쓰면 카메라 시계가 카메라마다 따로
    # 도는 카운터라 서로 직접 비교할 수 없다 — 스크립트는 두 카메라 카운터의 차이가 직선(발진기 ppm 차이)을
    # 따르는지, 그 직선에서 얼마나 벗어나는지(= 트리거 정렬 오차)를 본다.
    sync_check:
      script: "~/FLIR_control/scripts/check_trigger_sync.py"
      duration_s: 20
      # 기준 카메라 대비 카운터 잔차 표준편차. 비절연 입력(Line3)은 1 µs 안, 옵토(Line0)는 µs 단위.
      jitter_warn_us: 10
      jitter_fail_us: 1000
      # PC 도착 시각의 차이. 트리거를 받는 카메라는 수 ms 안(전송 차이), 트리거를 못 받고 자유 실행하는
      # 카메라는 트리거와 무관한 위상(최대 반 주기)에 있다.
      arrival_warn_ms: 10
      # 카메라 레이트가 리그 중앙값과 이 비율 넘게 다르면 경고
      rate_tolerance: 0.02

    # 주요 설정 아래에 따로 묶어 보이는 상자 — fields 의 panel: <이름>. 접을 수 있고, 검색하면 저절로 펼쳐진다.
    panels:
      camera:
        title: "카메라 제어"
        hint: >-
          카메라가 언제 · 무엇을 · 얼마나 밝게 찍을지 (동기 · 포맷 · 노출 · 네트워크). 줄 오른쪽 태그는 값이 카메라에
          닿는 경로다 — GenICam: 노드가 그 GenICam 노드에 그대로 쓴다. 노드→GenICam: 노드가 자기 로직으로 GenICam
          노드 여러 개를 쓴다 (camera.* 를 적용한 뒤라 같은 노드를 camera.* 로 줘도 이쪽이 이긴다 — 그래서 그런
          camera.* 키는 전체 설정에서 잠가 두었다). PC: 카메라에 가지 않는다.
      isp:
        title: "ISP — 카메라 온보드 영상 처리"
        hint: >-
          카메라가 영상을 내보내기 전에 카메라 안에서 거는 처리. BayerRG8 에서는 감마 · 화이트밸런스 · 블랙 레벨 ·
          결함 화소 보정만 살아 있고, 채도 · 샤프닝 · 색변환은 카메라가 끈다 (디모자이킹을 카메라가 할 때만 걸 수
          있다). '지정' 안 한 칸은 카메라에 남아 있는 값 그대로다 — 2026-09-21 리그는 전부 공장값(감마 0.8 켬 · WB
          Continuous)이었다. 여기 없는 노드는 전체 설정의 'GenICam · …' 상자에 전부 있다.
      pc:
        title: "PC 처리 · 출력"
        hint: >-
          카메라에 가지 않는 설정 — PC 의 카메라 노드가 받은 프레임에 타임스탬프를 찍고, 디모자이킹 · 압축해 토픽으로
          내보내는 방식. 흐린 이름 = 지금 설정에서는 효과가 없는 칸 (값은 그대로 실린다).

    fields:
      # --- 가시광 (flir_camera.yaml) ---
      - subset: visible
        panel: camera
        section: "동기 · 트리거"
        key: "ptp.enable"
        writes: [GevIEEE1588, GevIEEE1588Mode]
        label: "PTP 시각 동기"
        type: bool
        caution: true
        help: "GPIO HW 트리거 구성에서는 끕니다 — 노출은 트리거가 맞추고, 카메라에 PTP grandmaster 가 없습니다. 켜면 노드가 카메라가 PTP Slave 가 될 때까지(ptp.sync_timeout_ms, 60초) 기다리다 못 되면 죽습니다 (ptp.require_sync). 끄면 노드가 PTP 를 켜지 않을 뿐, 카메라에 이미 켜져 있던 PTP 를 끄지는 않습니다 (카메라에 남아 있는 상태 그대로). 꺼 두면 image_raw/metadata 의 camera_timestamp_ns 는 카메라마다 전원을 넣은 뒤부터 세는 카운터라 카메라끼리 직접 비교할 수 없습니다 ([동기 검증] 은 그걸 감안해 잽니다). PTP 액션 역할인 카메라는 노드가 알아서 켭니다."
      - subset: visible
        panel: camera
        section: "동기 · 트리거"
        key: "hardware_trigger.slave.trigger_source"
        writes: [TriggerSelector, TriggerMode, TriggerSource, LineSelector, LineMode]
        label: "트리거 입력 라인"
        type: enum
        choices: ["Line3", "Line0"]
        help: "HW 트리거 신호(PPS 등)를 받는 입력. Line3 은 비절연 입력이라 지연·지터가 최소입니다. Line0 은 옵토 절연이라 전기적으로 안전하지만 커플러 지연·지터가 µs 단위로 붙습니다. 어느 쪽이 맞았는지는 [동기 검증] 의 지터가 알려줍니다."
      - subset: visible
        panel: camera
        section: "동기 · 트리거"
        key: "hardware_trigger.slave.trigger_activation"
        writes: [TriggerActivation, TriggerOverlap]
        label: "트리거 엣지"
        type: enum
        choices: ["RisingEdge", "FallingEdge", "AnyEdge", "LevelHigh", "LevelLow"]
        help: "트리거 신호의 어느 엣지에 노출을 시작할지. HW 트리거인데 프레임이 0장이면 여기(극성)와 입력 라인부터 의심합니다."
      - subset: visible
        panel: pc
        section: "타임스탬프"
        key: "timestamp.mode"
        label: "header.stamp 기준"
        type: enum
        choices: ["camera_latched", "host", "camera_first_frame"]
        caution: true
        help: |-
          녹화되는 header.stamp 가 무엇을 뜻하는가. 값을 잘못 두면 데이터셋 전체의 시각이 조용히 틀어집니다.
          image_raw · camera_info · image_raw/metadata · image_rgb/compressed 가 모두 이 한 값을 씁니다 (metadata 의 camera_timestamp_ns 는 카메라 카운터 원본).
          · host — PC 가 프레임을 받은 시각. 전송·버퍼 지연만큼 늦고, 같은 트리거로 찍힌 프레임도 카메라마다 수~수십 ms 다르다 ([동기 검증] 의 header.stamp 차이).
          · camera_latched — 노출 시작 시각. 카메라 카운터를 2초마다 래치해 PC 시계로 옮긴다 (카메라 PTP 불필요, 오차 1 ms 미만). 아래 '트리거 격자 스냅' 을 켜면 트리거 엣지 시각 그대로.
          · camera_first_frame — 예전 방식 (첫 프레임 도착 시각에 고정). 쓰지 않습니다.
          바꾼 뒤엔 [동기 검증] 의 header.stamp 차이가 0 에 가까운지 확인하세요.
      - subset: visible
        panel: pc
        section: "타임스탬프"
        key: "timestamp.exposure_latch"
        label: "타임스탬프 래치 시점"
        type: enum
        choices: ["end", "start"]
        relevant_when: {"timestamp.mode": "camera_latched"}
        caution: true
        help: "카메라가 타임스탬프를 찍는 순간. 이 리그의 Blackfly S 는 노출이 끝날 때 찍는다 (flir_camera.yaml ExposureTime 주석의 실측: 노출 15 ms 두 대가 1 ms 인 나머지보다 ~14 ms 늦게 찍힘) — end 면 ExposureTime 을 빼서 노출 시작으로 되돌린다. 틀리게 두면 격자 스냅이 한 주기(33 ms) 어긋나고, 카메라 로그에 격자 경고가 뜬다."
      - subset: visible
        panel: pc
        section: "타임스탬프"
        key: "timestamp.trigger_grid_hz"
        label: "트리거 격자 스냅"
        type: float
        min: 0.0
        max: 120.0
        step: 1.0
        unit: "Hz"
        relevant_when: {"timestamp.mode": "camera_latched"}
        help: "HW 트리거 펄스가 GNSS PPS 에 위상을 맞춘 N Hz 이고 PC 시계가 같은 GNSS 에 PTP 로 맞춰져 있으면 N 을 넣는다 (30). 추정한 노출 시작을 가장 가까운 1/N 초 격자로 옮겨 header.stamp = 트리거 엣지 — 모든 카메라가 같은 값. 0 이면 스냅 안 함. 격자에서 얼마나 떨어졌는지 카메라 로그에 30초마다 남고 3 ms 를 넘으면 경고 (펄스가 PPS 에 안 맞음 · PC 시계 미동기 · 래치 시점 설정 오류)."
      - subset: visible
        panel: camera
        section: "영상 포맷 · 프레임레이트"
        key: "pixel_format"
        writes: [PixelFormat]
        label: "픽셀 포맷"
        type: enum
        choices: ["BayerRG8", "BayerRG12p", "BayerRG16", "Mono8", "Mono12p", "Mono16",
                  "RGB8Packed", "BGR8"]
        help: "카메라→PC 로 보내는 포맷. 녹화는 image_rgb/compressed(8비트 JPEG)라 BayerRG8 이면 충분하다. 16비트 컨테이너는 링크 대역폭을 두 배로 쓰는데 JPEG 까지 가지 못한다. 12p(packed)는 링크는 아끼지만 image_raw 는 16비트로 풀려 나간다. 대역폭 = 1920×1200 × 바이트/픽셀 × fps."
      - subset: visible
        panel: camera
        section: "영상 포맷 · 프레임레이트"
        key: "camera.AcquisitionFrameRate"
        label: "자유 실행 프레임레이트"
        type: float
        min: 1.0
        max: 60.0
        step: 1.0
        unit: "Hz"
        # 이 키는 원본 YAML에 주석 처리되어 있다 (자유 실행). 그래서 default 가 아니라 example —
        # default 를 주면 폼이 '지정 30' 으로 보이는데 원본과 같다고 판단해 파일에는 안 실려,
        # 화면과 실제가 어긋난다. 값을 지정하면 AcquisitionFrameRateEnable 도 같이 켜야 카메라가 받아들인다.
        example: 30.0
        implies: {"camera.AcquisitionFrameRateEnable": true}
        optional: true
