        help: "카메라 한 대가 스위치로 내보내는 최대 속도. 모든 카메라의 합이 스위치 업링크(10 GbE ≈ 1150 MB/s 실효)를 넘으면 스위치가 패킷을 버려 'Incomplete image' → 스트림 중단이 난다. 동기 트리거(HW 트리거 · PTP 액션)면 모든 카메라가 같은 순간에 프레임을 쏟아내 순간 합이 더 크다. 1920×1200 BayerRG8 30 fps 는 한 대에 약 69 MB/s 가 필요하니, 13~14대면 70~75 MB/s 가 한 프레임을 프레임 간격 안에 고르게 흘려보내는 값이다."
