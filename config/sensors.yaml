      - subset: visible
        panel: pc
        section: "디모자이킹 · 압축"
        key: "rgb_encoder"
        relevant_when: {"publish_rgb_compressed": true}
        label: "RGB 압축 인코더"
        type: enum
        choices: ["gpu", "cpu"]
        help: "gpu: 디모자이킹 + JPEG 을 GPU(RTX, NPP + nvJPEG)가 한다. 2026-09-19 실측 (14대 + A70 2대, 30 Hz, 점보): CPU 유휴 25% → 77%, 카메라 노드 하나 98% → 17%, 16대 다 뜨기까지(3초 간격 기동) 112초 → 52초, GPU 메모리 약 5 GB. 색·JPEG 크기는 CPU 와 같다. GPU 를 못 쓰면 노드가 알아서 cpu 로 돌아간다 (로그에 경고)."
      - subset: visible
        panel: pc
        section: "디모자이킹 · 압축"
        key: "gpu_demosaic"
        label: "GPU 디모자이킹"
        type: bool
        relevant_when: {"publish_rgb_compressed": true, "rgb_encoder": "gpu"}
        help: "켜면 Bayer 원본을 GPU 로 올려 디모자이킹까지 GPU 가 한다 (노드 CPU 약 17%). 끄면 디모자이킹은 CPU(아래 '디모자이킹' 방식)가 하고 JPEG 만 GPU (약 36%)."
      - subset: visible
        panel: pc
        section: "디모자이킹 · 압축"
        key: "color_processing"
        label: "디모자이킹"
        type: enum
        # 빠른 순 (대략). 이름은 flir_spinnaker_camera_node 의 ParseColorProcessing 이 받는 값.
        choices: ["ipp", "nearest_neighbor", "nearest_neighbor_avg", "bilinear", "edge_sensing",
                  "hq_linear", "directional_filter", "weighted_directional_filter", "rigorous"]
        caution: true
        help: |-
          GPU 인코딩(아래 'RGB 압축 인코더' = gpu, 'GPU 디모자이킹' 켬)이면 이 값은 쓰이지 않는다 — 디모자이킹도 GPU(NPP)가 한다.
          카메라는 픽셀마다 R·G·B 중 한 색만 잰 Bayer 모자이크(BayerRG8)를 보낸다. 빠진 두 색을 이웃 픽셀로 채워 RGB 를 만드는 게 디모자이킹(debayering)이고, PC 에서 카메라마다 매 프레임 돈다 — 리그에서 가장 빠듯한 CPU 예산이다.
          · nearest_neighbor — 가장 가까운 같은 색을 복사. 가장 빠름, 경계가 계단·지퍼 무늬.
          · nearest_neighbor_avg — 위 + 초록 평균. 비용 거의 같음.
          · bilinear — 주변 같은 색 평균. 빠름, 약간 뭉개지고 경계에 색 번짐.
          · ipp — Intel IPP(SIMD) 구현. bilinear 수준 비용에 화질은 더 낫다 → 기본값.
          · edge_sensing — 가로/세로 기울기를 보고 경계를 따라 보간. 경계 선명, 비용 ↑.
          · hq_linear — 기울기 보정 선형(5×5). 화질 좋음, 비용 큼.
          · directional_filter / weighted_directional_filter — 방향 적응 필터. 화질 ↑, 느림.
          · rigorous — 가장 느리고 가장 정확. 실시간용 아님.
          실측(8대 × 30 Hz × 20초): hq_linear 는 예산을 넘겨 NewestOnly 가 늦은 프레임을 경고 없이 버렸다 — 카메라마다 1.7~3.0% 손실. ipp · bilinear 는 0%.
      - subset: visible
        panel: pc
        section: "수신"
        key: "buffer_handling_mode"
        writes: ["stream.StreamBufferHandlingMode"]
        label: "수신 버퍼 처리"
        type: enum
        choices: ["NewestOnly", "OldestFirst", "OldestFirstOverwrite", "NewestFirst"]
        caution: true
        help: |-
          NewestOnly: 처리가 밀리면 오래된 프레임을 버리고 최신만 처리 — 지연은 작고, 밀리면 프레임이 빠진다 (진단의 카메라 frame_id 로 보인다).
          OldestFirst: 쌓인 순서대로 전부 처리 — 순간 과부하를 손실 대신 지연으로 넘긴다. 단 이 노드는 header.stamp 를 버퍼에서 꺼낸 시각(now)으로 찍어서, 밀린 프레임은 밀린 만큼 늦은 시각이 찍힌다 (진단에 안 보인다). 버퍼 32장이 다 차면 결국 새 프레임이 빠진다.
          처리가 따라가는 동안(예: 15 Hz · ipp)은 둘이 똑같이 동작하고, 차이는 순간 과부하 때만 난다. 정확한 촬영 시각은 image_raw/metadata 의 camera_timestamp_ns 에 남는다.

      # --- 가시광 ISP (panel: isp) — 자동 노출 · 게인 한계는 카메라 제어(panel: camera)로 옮겼다 ---
      #
      # example 은 2026-09-21 리그 BFS 12대에서 ros2 param dump 로 읽은 실제 값 (공장값) — '지정' 을 켜기 전
      # 칸에 보이는 값이 지금 카메라가 하고 있는 것과 같게.
      #
      # 값 노드는 공개 이름(Gamma · Saturation · Sharpening) 대신 같은 레지스터의 별칭(*_FloatVal)을 쓴다.
      # 공개 노드는 짝 Enable 이 꺼진 채 기동하면 잠겨 있어서, 카메라 노드가 파라미터로 등록하지 않고 파일의
      # 값을 조용히 버린다 (노드는 기동할 때 쓸 수 있는 노드만 등록하고, Enable 은 그 뒤에 적용한다).
      # 별칭은 잠김 조건이 없어 늘 등록된다. 대신 카메라의 범위 검사를 안 거치므로 min/max 를 좁게 잡는다 —
      # 범위 밖 값이면 기동 중 노드가 죽는다.
      #
      # enabled_when 이 안 맞는 값은 파일에서 빠진다 — 잠긴 노드에 쓰면 노드가 'not writable' 로 죽는다.
      # 자동 노출 · 게인 한계와 WB auto 프로파일은 auto 가 꺼져 있어도 잠기지 않아서 relevant_when (흐리게만).
      - subset: visible
        panel: isp
        section: "톤"
        key: "camera.GammaEnable"
        label: "감마 보정"
        type: bool
        example: true
        optional: true
        help: "카메라가 8비트로 자르기 전에 밝기 곡선을 건다 — PC 쪽(Spinnaker ImageProcessor)에는 감마가 없다. Bayer 출력에도 걸려서 녹화되는 image_raw 까지 비선형이 된다 (선형 값이 필요한 후처리가 있으면 끈다). 지정 안 하면 카메라에 남아 있는 값 그대로라 카메라마다 다를 수 있다 — 쓰든 안 쓰든 지정해 두는 게 좋다."
      - subset: visible
        panel: isp
        section: "톤"
        key: "camera.Gamma_FloatVal"
        alias_of: "Gamma"
        label: "감마 값"
        type: float
        min: 0.5
        max: 4.0
        step: 0.05
        example: 0.8
        optional: true
        enabled_when: {"camera.GammaEnable": true}
        help: "1.0 = 곡선 없음. SFNC 관례로는 1 보다 작을수록 암부가 밝아진다 (공장값 0.8) — 처음 바꿀 때 미리보기로 방향을 확인할 것. 노출을 늘리지 않고 어두운 장면을 밝힐 수 있다: 노출이 길면 모션 블러가 늘고, 노출 끝에 찍히는 타임스탬프도 밀린다. 카메라 안에서 10/12비트일 때 걸려서 PC 에서 8비트 영상에 거는 것보다 암부 계조가 덜 뭉개진다. 키가 camera.Gamma 가 아닌 이유는 위 주석 (Gamma 는 감마를 꺼 둔 채 기동하면 등록이 안 된다)."
      - subset: visible
        panel: isp
        section: "톤"
        key: "camera.BlackLevel"
        label: "블랙 레벨"
        type: float
        min: 0.0
        max: 5.0
        step: 0.1
        unit: "%"
        example: 0.0
        optional: true
        help: "영상 신호에 더하는 오프셋 (전체 범위의 %, BlackLevelSelector=All 의 값). 올리면 가장 어두운 곳이 0 에서 떠서 암부 노이즈가 잘리지 않는 대신 대비가 준다."
      - subset: visible
        panel: isp
        section: "톤"
        key: "camera.BlackLevelClampingEnable"
        label: "블랙 레벨 자동 클램핑"
        type: bool
        example: true
        optional: true
        help: "센서의 차광 화소로 다크 전류를 재서 매 프레임 흑점을 맞춘다 (공장값 켬). 끄면 센서가 데워질수록 검은색이 떠오른다 — 특별한 이유가 없으면 켜 둔다."
      - subset: visible
        panel: isp
        section: "화이트밸런스"
        key: "camera.BalanceWhiteAuto"
        label: "화이트밸런스 auto"
        type: enum
        choices: ["Off", "Once", "Continuous"]
        example: "Continuous"
        optional: true
        caution: true
        help: |-
          Continuous(공장값)면 카메라마다 따로, 계속 R/B 비율을 바꾼다 — 2026-09-21 리그 12대를 읽어 보니 R 1.10~1.79 · B 1.38~1.83 으로 카메라끼리 색이 달랐고, 장면이 바뀌면 녹화 중에도 바뀐다.
          여러 카메라를 이어 붙이거나 서로 비교하는 데이터면 Off 로 두고 아래 R · B 비율을 모든 카메라에 같게 주는 게 좋다.
          Once: 기동할 때 한 번 맞추고 멈춘다 (카메라마다 여전히 다른 값).
          BayerRG8 에서도 카메라가 이 노드를 살려 둔다 — Bayer 값에 채널별 게인으로 들어가서 image_raw 에도 남는다.
      - subset: visible
        panel: isp
        section: "화이트밸런스"
        key: "camera.BalanceRatioRed_Val"
        alias_of: "BalanceRatio (Red)"
        label: "WB 비율 — R (G 기준)"
        type: float
        # 파일에는 카메라 레지스터 값 = 비율 × 8192 (소수 13비트 고정소수점) 정수로 들어간다. example 도 파일 단위.
        scale: 8192
        file_type: int
        min: 0.5
        max: 4.0
        step: 0.01
        example: 13926            # 파일 단위 (1.70 × 8192)
        optional: true
        enabled_when: {"camera.BalanceWhiteAuto": "Off"}
        help: "R 게인 ÷ G 게인. 공개 노드 BalanceRatio 는 BalanceRatioSelector 로 한 채널씩 고르는 구조라 파라미터 파일로는 한 채널밖에 못 넣는다 — 그래서 채널별 레지스터(BalanceRatioRed_Val = 비율 × 8192)를 쓴다. 8192 는 2026-09-21 리그 12대 모두에서 BalanceRatio(Red) × 8192 = 이 레지스터 값으로 확인했다. 예시값은 그 12대의 중앙값. 값 잡는 법: WB auto 를 Once 로 흰 판을 보고 띄운 뒤, ros2 param get <네임스페이스>/flir_camera camera.BalanceRatioRed_Val 을 8192 로 나눈다."
      - subset: visible
        panel: isp
        section: "화이트밸런스"
        key: "camera.BalanceRatioBlue_Val"
        alias_of: "BalanceRatio (Blue)"
        label: "WB 비율 — B (G 기준)"
        type: float
        scale: 8192
        file_type: int
        min: 0.5
        max: 4.0
        step: 0.01
        example: 13107            # 파일 단위 (1.60 × 8192)
        optional: true
        enabled_when: {"camera.BalanceWhiteAuto": "Off"}
        help: "B 게인 ÷ G 게인. 레지스터 · 값 잡는 법은 R 과 같다 (camera.BalanceRatioBlue_Val = 비율 × 8192)."
      - subset: visible
        panel: isp
        section: "화이트밸런스"
        key: "camera.BalanceWhiteAutoProfile"
        label: "WB auto 프로파일"
        type: enum
        choices: ["Indoor", "Outdoor"]
        example: "Indoor"
        optional: true
        relevant_when: {"camera.BalanceWhiteAuto": ["Once", "Continuous", null]}  # null = 지정 안 함 (공장값 Continuous)
        help: "auto WB 가 가정하는 광원 (공장값 Indoor). 야외 주행이면 Outdoor."
      - subset: visible
        panel: isp
        section: "결함 화소 보정"
        key: "camera.DefectCorrectStaticEnable"
        label: "결함 화소 보정"
        type: bool
        example: true
        optional: true
        help: "공장에서 잰 불량 화소 표로 핫 · 데드 픽셀을 메운다 (공장값 켬). 끄면 늘 같은 자리에 흰 점 · 검은 점이 남는다. 표 편집은 SpinView 로 (인덱스로 고르는 표라 파라미터 파일로는 못 쓴다)."
      - subset: visible
        panel: isp
        section: "결함 화소 보정"
        key: "camera.DefectCorrectionMode"
        label: "결함 화소 채우는 방법"
        type: enum
        choices: ["Average", "Highlight", "Zero"]
        example: "Average"
        optional: true
        enabled_when: {"camera.DefectCorrectStaticEnable": true}
        help: "Average: 이웃 평균으로 메운다 (공장값). Highlight: 결함 화소를 밝게 칠해 위치를 보여준다 (점검용). Zero: 0 으로."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.SaturationEnable"
        label: "채도 조정"
        type: bool
        example: false
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"]}
        help: "카메라가 디모자이킹까지 해서 RGB 로 보낼 때만 산다. BayerRG8 은 디모자이킹을 PC 가 하므로 카메라가 이 노드를 끈다 (떠 있는 노드에 등록조차 안 된다). 참고로 RGB8 은 1920×1200 × 3 B × 30 fps ≈ 207 MB/s 라 GigE 한 대(125 MB/s)에 안 들어간다 — 해상도나 fps 를 낮춰야 쓸 수 있다."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.Saturation_FloatVal"
        alias_of: "Saturation"
        label: "채도"
        type: float
        min: 0.0
        max: 2.0
        step: 0.05
        example: 1.0
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"], "camera.SaturationEnable": true}
        help: "1.0 = 그대로, 0 = 흑백. 별칭 키(_FloatVal)를 쓰는 이유는 감마 값과 같다."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.SharpeningEnable"
        label: "샤프닝"
        type: bool
        example: false
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"]}
        help: "카메라 안에서 경계를 강조한다. RGB 출력 전용 (채도 설명 참고)."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.SharpeningAuto"
        label: "샤프닝 auto"
        type: bool
        example: true
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"], "camera.SharpeningEnable": true}
        help: "켜면 카메라가 장면에 따라 샤프닝 양과 문턱을 정한다 (공장값 켬)."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.SharpMult_FloatVal"
        alias_of: "Sharpening"
        label: "샤프닝 양"
        type: float
        min: 0.0
        max: 2.0
        step: 0.05
        example: 0.5
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"], "camera.SharpeningEnable": true, "camera.SharpeningAuto": false}
        help: "Sharpening 노드의 레지스터 별칭 (공장값 0.5). 별칭을 쓰는 이유는 감마 값과 같다."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.ColorTransformationEnable"
        label: "색 보정 행렬 (CCM)"
        type: bool
        example: true
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"]}
        help: "카메라가 센서 색을 표준 RGB 로 옮기는 3×3 행렬 (공장값 켬). 행렬 칸을 직접 쓰는 건 선택자 구조라 파라미터 파일로는 못 한다 — 아래 광원 프리셋으로 고른다."
      - subset: visible
        panel: isp
        section: "RGB 출력 전용 (Bayer 에서는 카메라가 끈다)"
        key: "camera.RgbTransformLightSource"
        label: "CCM 광원 프리셋"
        type: enum
        choices: ["General", "Tungsten2800K", "WarmFluorescent3000K", "CoolFluorescent4000K",
                  "Daylight5000K", "Cloudy6500K", "Shade8000K"]
        example: "General"
        optional: true
        enabled_when: {"pixel_format": ["RGB8Packed", "BGR8"], "camera.ColorTransformationEnable": true}
        help: "광원별로 보정해 둔 행렬 중 하나를 고른다 (공장값 General). 광원을 바꾸면 카메라가 WB 비율도 그 광원 값으로 바꿀 수 있다."
      - subset: visible
        panel: isp
        section: "모노 출력 전용"
        key: "camera.IspEnable"
        label: "모노 출력에 ISP 사용"
        type: bool
        example: false
        optional: true
        enabled_when: {"pixel_format": ["Mono8", "Mono12p", "Mono16"]}
        help: "컬러 카메라가 Mono 포맷으로 보낼 때 카메라의 영상 처리 코어를 거칠지 (공장값 끔). 취득 중에는 잠겨서 기동 때만 바뀐다."

      # --- 열화상 (thermal_camera.yaml) ---
      #
      # A70은 Blackfly와 노드맵이 다르다: Exposure/Gain이 없고 프레임레이트는
      # 실수가 아니라 열거형(IRFrameRate)이다. 선택지는 thermal_camera.yaml 주석을 따른다.
      - subset: thermal
        panel: pc
        section: "타임스탬프"
        key: "timestamp.mode"
        label: "header.stamp 기준"
        type: enum
        choices: ["camera_latched", "host"]
        caution: true
        help: |-
          · camera_latched — A70 자기 카운터를 2초마다 래치해 PC 시계로 옮긴 시각에서 아래 '포착 지연' 을 뺀 값. 전송·버퍼 지연이 끼지 않는다.
          · host — PC 가 프레임을 받은 시각 (전송·처리 지연만큼 늦고 흔들린다).
          A70 은 외부 트리거로 프레임을 찍을 수 없어 (FrameStart 트리거가 없다) 가시광 트리거와 위상이 맞지 않는다 — 가시광과는 이 stamp 로 짝짓는다.
      - subset: thermal
        panel: pc
        section: "타임스탬프"
        key: "timestamp.capture_offset_ns"
        label: "포착 지연"
        type: int
        scale: 1000000            # 파일은 ns, 폼은 ms
        file_type: int
        min: 0
        max: 200
        step: 1
        unit: "ms"
        relevant_when: {"timestamp.mode": "camera_latched"}
        caution: true
        help: "마이크로볼로미터는 노출이 없는 대신, 화소의 열 시정수(보통 수~십수 ms) 동안의 장면을 섞어 담고 카메라 안에서 NUC · 노이즈 감소 · 온도 변환을 거친 뒤 타임스탬프가 찍힌다. 그 지연을 여기 넣으면 header.stamp 가 장면의 순간이 된다. 추측하지 말고 잰다: 뜨거운 물체 앞을 판자로 빠르게 가로질러, 판자 가장자리가 지나가는 시각을 가시광과 열화상 header.stamp 로 비교한 차이. 재기 전엔 0 (카메라가 찍은 시각)."
      - subset: thermal
        panel: camera
        section: "영상"
        key: "pixel_format"
        writes: [PixelFormat]
        label: "픽셀 포맷"
        type: enum
        choices: ["Mono16", "Mono8"]
        help: "Mono16 이어야 온도값(IRFormat)이 그대로 실린다. Mono8 은 표시용으로 스케일된 값이라 온도로 되돌릴 수 없다."
      - subset: thermal
        panel: camera
        section: "영상"
        key: "camera.IRFrameRate"
        label: "프레임레이트"
        type: enum
        choices: ["Rate60Hz", "Rate30Hz", "Rate15Hz", "Rate7Hz", "Rate4Hz"]
      - subset: thermal
        panel: camera
        section: "영상"
        key: "camera.IRFormat"
        label: "온도 포맷"
        type: enum
        choices: ["TemperatureLinear10mK", "TemperatureLinear100mK", "Radiometric"]
        help: "TemperatureLinear10mK: mono16 값 × 0.01 = 켈빈. 100mK: × 0.1. Radiometric: 원시 카운트 (Planck 변환 필요)."
      - subset: thermal
        panel: camera
        section: "영상"
        key: "camera.IRWindowing"
        label: "센서 윈도잉"
        type: enum
        choices: ["Off", "Half", "Quarter"]
        example: "Off"
        optional: true
        help: "센서 일부만 읽어 최대 프레임레이트를 올린다. 해상도가 줄어든다."
      - subset: thermal
        panel: camera
        section: "보정"
        key: "camera.NUCMode"
        label: "NUC (셔터 보정)"
        type: enum
        choices: ["Automatic", "Off"]
        help: "Automatic 은 주기적으로 셔터를 닫아 순간 영상이 멈춘다. Off 면 멈춤은 없지만 시간이 지나며 영상이 흐려진다 (NUCAction 으로 수동 보정)."
      - subset: thermal
        panel: pc
        section: "출력"
        key: "publish_raw"
        label: "image_raw 발행"
        type: bool
        help: "열화상의 출력은 image_raw(mono16) 하나다 — 끄면 녹화할 게 없다."

      # --- 런치 인자 (params 파일이 아니라 ros2 launch 인자) ---
      - target: launch_arg
        key: sequential_start
        label: "순차 기동"
        type: bool
        default: false
        help: "앞 카메라 노드가 'Camera acquisition started' 를 찍은 뒤에 다음 노드를 띄운다. 노드마다 리그 전체를 열거하는데 (15대면 약 13초) 그동안 모든 카메라를 쥐고 있어서, 고정 간격으로 띄우면 자기 카메라를 설정하던 노드가 -1005/-1010 으로 밀려 죽었다. 대신 기동 시간이 대수 × (열거 + 설정) 으로 늘어난다."
      - target: launch_arg
        key: sequential_start_timeout
        label: "순차 기동 — 한 대 최대 대기"
        type: float
        min: 5.0
        max: 180.0
        step: 5.0
        unit: "s"
        enabled_when: {"sequential_start": true}
        help: "이 시간 안에 안 뜨는 카메라는 기다리지 않고 다음 카메라를 띄운다 (Init 재시도에 걸린 한 대가 리그 전체를 막지 않게)."
      - target: launch_arg
        key: camera_start_stagger
        label: "고정 간격 기동"
        type: float
        min: 0.0
        max: 20.0
        step: 0.5
        unit: "s"
        default: 3.0
        enabled_when: {"sequential_start": false}
        help: "순차 기동을 끄면 카메라 노드를 이 간격으로 띄운다. GigE 카메라는 한 번에 하나만 Read/Write 접근을 얻어서 0 이면 동시 Init 이 서로 밀어낸다."
      - target: launch_arg
        key: ptp_master_interface
        label: "PTP grandmaster NIC"
        type: string
        # 비우면 자동 (sensor_config.ptp_master_nic) — 동기 방식이 PTP 액션인 카메라나 'PTP 시각 동기' 가 있으면
        # 그 카메라들이 달린 NIC 에서 ptp4l, 없으면 안 띄운다.
        default: ""
        placeholder: "자동"
        # ros2 launch 는 빈 값 인자를 받지 않는다 ("key:=" 는 malformed) — 자동으로도 정할 게 없으면 이 값으로 넘긴다
        empty_value: "none"
        help: "비워 두면 자동입니다 — 동기 방식이 PTP 액션인 카메라가 있거나 'PTP 시각 동기' 를 켰으면, 그 카메라들이 달린 NIC(보통 enp3s0f1)에서 ptp4l 을 띄워 PC 가 카메라들의 PTP grandmaster(기준 시계)가 됩니다. 없으면(HW 트리거 · 자유 실행) 띄우지 않습니다. 무엇으로 정했는지는 런치 로그 맨 위 [GUI] 줄에 남습니다. NIC 을 직접 적으면 그걸 쓰고, none 이면 ptp4l 을 안 띄웁니다. 이 칸은 PC 의 카메라 NIC 이름입니다 (grandmaster 장비의 NIC 이 아님). 외부 grandmaster · boundary clock 이 이미 돌고 있으면(예: Orin GNSS → sudo ptp4l -f ptp4l-bc.conf) 그 NIC 에는 띄우지 않고 [GUI] 줄에 남깁니다 — 비워 두면 그 PTP 를 그대로 씁니다."
      - target: launch_arg
        key: publish_extrinsics_tf
        label: "리그 extrinsics TF 발행"
        type: bool
        default: true
        help: "캘리브레이션 전 카메라는 identity(0 0 0)로 발행됩니다."

  # ---------------------------------------------------------------------------
  # Ouster LiDAR
  # ---------------------------------------------------------------------------
  - key: ouster
    label: "Ouster LiDAR"
    workspaces:
      - "/opt/ros/humble/setup.bash"
    launch_package: ouster_ros
    launch_file: driver.launch.py
    params: "~/FLIR_control/src/flir_spinnaker_camera/config/lidar_driver_params.yaml"
    params_arg: params_file
    # 데이터 토픽이 떠야 기동 완료. "^/ouster/" 만 보면 센서에 못 붙은 드라이버의 os_driver/transition_event 하나로도
    # '실행 중' 이 돼서, 라이다 없이 클립이 녹화됐다 (2026-09-22 18:50~).
    topic_regex: "^/ouster/(points|lidar_packets)$"
    # 장비가 한 대뿐 — 감지된 장비와 설정을 탭으로 나누지 않고 한 화면에 (위에 장비 한 줄 · 센서 동기 상태, 아래 설정)
    single_device: true
    # 센서가 지금 무엇으로 시각을 맞추는지(PPS · NMEA · PTP)를 센서 HTTP API(/api/v1/time)에서 5초마다 읽어 '동기 방식'
    # 아래에 보인다. 읽기만 한다 — PPS 극성 · NMEA · 다목적 핀 같은 센서 쪽 설정은 ouster_ros 파라미터에 없어서 센서
    # 웹페이지에서 정한다. 드라이버는 기동할 때 자기 파라미터(timestamp_mode · phase_lock_enable …)를 센서에 써 넣는다.
    sync_status: ouster_http
    managed_launch_args:
      ouster_ns: "params 파일의 노드 키(ouster/os_driver)와 토픽(/ouster/…)이 이 이름을 전제로 합니다"
      os_driver_name: "params 파일의 노드 키(ouster/os_driver)와 맞아야 파라미터가 적용됩니다"
    discovery:
      kind: ouster_probe
      # 프로브할 주소. params의 sensor_hostname 은 자동으로 여기에 더해진다.
      hosts: []
      port: 80
      timeout_s: 3.0

    fields:
      - key: "timestamp_mode"
        section: "동기"
        label: "동기 방식"
        writes: [timestamp_mode]
        writes_to: "센서 설정"
        type: enum
        choices: ["TIME_FROM_ROS_TIME", "TIME_FROM_SYNC_PULSE_IN", "TIME_FROM_PTP_1588", "TIME_FROM_INTERNAL_OSC"]
        choice_labels:
          TIME_FROM_ROS_TIME: "PC 수신 시각"
          TIME_FROM_SYNC_PULSE_IN: "GNSS PPS (+ NMEA)"
          TIME_FROM_PTP_1588: "PTP (네트워크)"
          TIME_FROM_INTERNAL_OSC: "라이다 내부 시계"
        caution: true
        help: |-
          라이다 점군의 header.stamp 에 무슨 시각을 붙일지 (드라이버 파라미터 timestamp_mode). 바로 아래 줄에 센서가 지금 PPS · NMEA · PTP 를 받고 있는지가 보이고, 고른 방식에 필요한 게 없으면 경고가 뜬다.
          · PC 수신 시각 (TIME_FROM_ROS_TIME) — PC 가 패킷을 받은 시각. 카메라와 같은 PC 시계지만 전송 · 처리 지연이 섞여 흔들린다.
          · GNSS PPS (TIME_FROM_SYNC_PULSE_IN) — GNSS 의 1 초 펄스로 라이다 시계의 초 경계를 맞춘다. PPS 는 '지금이 정각'만 알려줘서 몇 시인지는 NMEA 가 함께 들어와야 한다 — 없으면 부팅 후 경과 초가 찍힌다. 배선: PPS → 라이다 박스 SYNC_PULSE_IN, NMEA → MULTIPURPOSE_IO (센서 웹페이지에서 다목적 핀을 INPUT_NMEA_UART 로).
          · PTP (TIME_FROM_PTP_1588) — 네트워크로 시계를 맞춘다 (배선 불필요). 라이다 망에 PTP 기준 시계(grandmaster)가 있어야 한다. 이 리그는 라이다가 카메라 스위치(enp3s0f1)에 있어서, 카메라군을 기동할 때 GUI 가 띄우는 ptp4l 을 같이 받는다 — 카메라군을 안 띄우면 기준 시계가 없다. 전체 설정의 ptp_utc_tai_offset 은 기준 시계가 주는 시각의 종류에 맞춘다: GUI 의 ptp4l(PC 시스템 시계)은 UTC 를 주므로 0, TAI 를 주는 grandmaster(예: GNSS 장비에 직접 물림)면 -37. 2026-09-22 확인: 라이다의 PTP 시각 = PC UTC.
          · 라이다 내부 시계 (TIME_FROM_INTERNAL_OSC) — 켠 뒤 0 초부터. 다른 센서와 비교할 수 없다.
      - key: "phase_lock_enable"
        section: "동기"
        label: "위상 고정 (카메라 촬영 각도 맞춤)"
        writes: [phase_lock_enable]
        writes_to: "센서 설정"
        type: bool
        help: |-
          라이다 회전을 PTP 시계의 정각에 맞물린다 — 매 0.1초 정각(10 Hz)마다 빔이 아래 '정각 때 라이다 각도' 를 지나게 된다.
          카메라는 PTP 액션으로 n/30초(정각 기준 격자)에 찍으므로, 켜면 카메라가 늘 같은 라이다 각도에서 찍힌다: 정각 각도가 0° 면 0° · 120° · 240° (한 바퀴에 세 번).
          끄면 회전 속도는 PTP 에 맞지만 각도는 기동할 때마다 아무 데나 된다 (2026-09-22 녹화: 약 20° 어긋남).
          조건: 동기 방식이 PTP(또는 GNSS PPS)이고 기준 시계가 있어야 한다 — 이 리그는 카메라군을 기동해야 GUI ptp4l 이 뜬다. OS-2 의 위상 고정 정확도는 약 ±5° (Ouster 문서).
          맞았는지는 위 센서 동기 상태 줄(위상 고정 잠김)과 녹화 진단의 '카메라가 찍을 때 라이다 각도' 로 확인.
          드라이버가 기동할 때 센서에 써 넣는다 (persist_config 가 꺼져 있으면 센서 재부팅 뒤엔 원래대로 — 다시 기동하면 또 넣는다).
      - key: "phase_lock_offset"
        section: "동기"
        label: "정각 때 라이다 각도"
        writes: [phase_lock_offset]
        writes_to: "센서 설정"
        type: float
        min: 0
        max: 359.999
        step: 1
        unit: "°"
        scale: 1000
        file_type: int
        enabled_when: {phase_lock_enable: true}
        help: |-
          매 정각(0.1초마다) 빔이 지나는 각도 — Ouster 라이다 좌표계 기준: 0° = 커넥터(케이블) 쪽, 위에서 볼 때 반시계로 커진다 (라이다는 시계 방향으로 돈다).
          카메라 30 Hz · 라이다 10 Hz 면 카메라는 이 각도, +120°, +240° 에서 찍힌다 (0° 면 0 · 120 · 240°).
          카메라 노출(예: 10 ms) 동안 라이다는 36° 돈다 — 노출 가운데를 맞추려면 노출 시간의 절반만큼 더한다 (10 ms → 18°).
          녹화 진단이 실제 각도를 재서 '0/120/240° 에서 +x°' 로 알려 준다 — 어긋난 만큼 이 값에서 빼면 된다.
          (드라이버 파라미터 phase_lock_offset, 파일에는 밀리도 = 이 값 × 1000)
      - key: "sensor_hostname"
        section: "연결"
        label: "센서 주소"
        type: string
        help: "IP 또는 os-<serial>.local."
      - key: "lidar_mode"
        section: "스캔"
        label: "해상도 / 회전수"
        writes: [lidar_mode]
        writes_to: "센서 설정"
        type: enum
        choices: ["", "512x10", "512x20", "1024x10", "1024x20", "2048x10", "4096x5"]
        help: "빈 값이면 센서의 현재 모드를 그대로 씁니다."
      - key: "udp_profile_lidar"
        section: "스캔"
        label: "UDP 프로파일"
        writes: [udp_profile_lidar]
        writes_to: "센서 설정"
        type: enum
        choices: ["", "LEGACY", "RNG19_RFL8_SIG16_NIR16", "RNG15_RFL8_NIR8"]
      - key: "proc_mask"
        section: "출력"
        label: "처리 마스크"
        type: string
        help: "IMG|PCL|IMU|SCAN|RAW. RAW 가 있어야 lidar_packets 가 나옵니다 (녹화용)."
      - target: launch_arg
        key: viz
        label: "RViz 창 띄우기"
        type: bool
        help: "켜면 드라이버와 같이 rviz2 가 뜬다. 녹화 탭 미리보기로 충분하면 꺼서 CPU/GPU 를 아낀다."

  # ---------------------------------------------------------------------------
  # GNSS / INS — OxTS RT2000
  # ---------------------------------------------------------------------------
  - key: gnss_rt2000
    label: "GNSS RT2000"
    workspaces:
      - "~/rt2000_ws/install/setup.bash"
    launch_package: oxford_gps_eth
    launch_file: gps.launch.py
    # 이 센서군을 켜면 NTRIP 보정(str2str: NGII VRS → USB-시리얼 → RT2000 COM2)도 같이 켜고 끈다.
    # 계정 · 시리얼 · 기본 좌표는 ~/.config/dm_clip_gui/ntrip.yaml (scripts/ntrip_companion.py)
    ntrip: true
    params: "~/rt2000_ws/src/oxford_gps_eth/config/gps_params.yaml"
    params_arg: params_file
    topic_regex: "^/gps/"
    managed_launch_args:
      namespace: "기동 완료 판정과 녹화 토픽이 /gps/… 를 전제로 합니다"
    discovery:
      kind: ncom_listen
      port: 3000
      timeout_s: 2.0

    fields:
      - key: "port"
        label: "NCOM 포트"
        type: int
        min: 1
        max: 65535
        step: 1
        help: "OxTS 기본 3000."
      - key: "interface"
        label: "수신 인터페이스"
        type: string
        help: "비우면 전체. 지정하면 SO_BINDTODEVICE 라 CAP_NET_RAW 가 필요합니다."
      - key: "frame_id_gps"
        label: "GPS frame_id"
        type: string
      - key: "use_gps_time"
        label: "GPS 시각으로 스탬프"
        type: bool
        help: "끄면 시스템 시계. 카메라/라이다와 맞추려면 끈 상태가 맞습니다."
      - key: "publish_imu_when_not_ready"
        label: "초기화 중에도 IMU 발행"
        type: bool
